# Keeps the free-tier Supabase pledge database from auto-pausing
# (Supabase pauses free projects after 7 days without activity, which
# silently breaks the Sign the Pledge form). Runs twice a week.
name: Pledge database keep-alive
on:
  schedule:
    - cron: "17 13 * * 1,4"   # Mon & Thu, 9:17 a.m. Eastern (EDT)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping pledge counter
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            "https://jngtuihzliqvfmfkjapp.supabase.co/rest/v1/rpc/get_pledge_count" \
            -H "apikey: sb_publishable_-FEW-wNxEmcU7_fJGlhm8A_ffYkakgk" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code, supporters: $(cat /tmp/out)"
          test "$code" = "200"
